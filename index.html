</div>
<h2 style="margin-top:60px;color:#ff4f81;">
Mini juego ❤️
</h2>

<p style="font-size:18px;">
Toca la pantalla o presiona espacio para volar ✨
</p>

<canvas id="gameCanvas" width="400" height="600" 
style="
background:white;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
max-width:90%;
">
</canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird = {
    x:80,
    y:200,
    size:20,
    velocity:0
};

let gravity = 0.5;
let jump = -8;

let pipes = [];
let score = 0;

function createPipe(){
    let gap = 150;
    let topHeight = Math.random()*250 + 50;

    pipes.push({
        x:400,
        top:topHeight,
        bottom:topHeight + gap,
        width:60
    });
}

setInterval(createPipe,1800);

function drawHeart(x,y,size){
    ctx.fillStyle="#ff4f81";

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.bezierCurveTo(
        x-size/2,
        y-size/2,
        x-size,
        y+size/3,
        x,
        y+size
    );

    ctx.bezierCurveTo(
        x+size,
        y+size/3,
        x+size/2,
        y-size/2,
        x,
        y
    );

    ctx.fill();
}

function update(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    bird.velocity += gravity;
    bird.y += bird.velocity;

    drawHeart(bird.x,bird.y,bird.size);

    for(let i=0;i<pipes.length;i++){

        let p = pipes[i];

        p.x -= 3;

        ctx.fillStyle="#ff9dbb";

        ctx.fillRect(p.x,0,p.width,p.top);

        ctx.fillRect(
            p.x,
            p.bottom,
            p.width,
            canvas.height-p.bottom
        );

        if(
            bird.x + bird.size > p.x &&
            bird.x - bird.size < p.x + p.width &&
            (
                bird.y - bird.size < p.top ||
                bird.y + bird.size > p.bottom
            )
        ){
            resetGame();
        }

        if(p.x + p.width < 0){
            pipes.splice(i,1);
            score++;
        }
    }

    if(
        bird.y > canvas.height ||
        bird.y < 0
    ){
        resetGame();
    }

    ctx.fillStyle="#ff4f81";
    ctx.font="30px Arial";
    ctx.fillText("❤️ "+score,20,50);

    requestAnimationFrame(update);
}

function resetGame(){
    bird.y = 200;
    bird.velocity = 0;
    pipes = [];
    score = 0;
}

document.addEventListener("keydown",function(e){
    if(e.code === "Space"){
        bird.velocity = jump;
    }
});

canvas.addEventListener("click",function(){
    bird.velocity = jump;
});

update();

</script>

</body>
</html>
