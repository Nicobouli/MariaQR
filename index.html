<div style="
margin-top:40px;
display:flex;
justify-content:center;
">

<div style="
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,0.2);
">

<h3 style="
color:#ff4f81;
margin-top:0;
">
Mini juego ❤️
</h3>

<canvas id="miniGame" width="250" height="350"
style="
border-radius:15px;
background:#fff5f8;
">
</canvas>

<p style="font-size:14px;">
Toca para saltar ✨
</p>

</div>
</div>

<script>

const canvas = document.getElementById("miniGame");
const ctx = canvas.getContext("2d");

let birdY = 150;
let velocity = 0;
let gravity = 0.4;
let jump = -6;

let pipes = [];
let score = 0;

function addPipe(){

    let gap = 90;

    let topHeight =
        Math.random()*140 + 40;

    pipes.push({
        x:250,
        top:topHeight,
        bottom:topHeight + gap,
        width:40
    });
}

setInterval(addPipe,1600);

function drawHeart(x,y,size){

    ctx.fillStyle="#ff4f81";

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.bezierCurveTo(
        x-size/2,
        y-size/2,
        x-size,
        y+size/3,
        x,
        y+size
    );

    ctx.bezierCurveTo(
        x+size,
        y+size/3,
        x+size/2,
        y-size/2,
        x,
        y
    );

    ctx.fill();
}

function resetGame(){

    birdY = 150;
    velocity = 0;
    pipes = [];
    score = 0;
}

function update(){

    ctx.clearRect(0,0,250,350);

    velocity += gravity;
    birdY += velocity;

    drawHeart(70,birdY,12);

    for(let i=0;i<pipes.length;i++){

        let p = pipes[i];

        p.x -= 2;

        ctx.fillStyle="#ffb3c7";

        ctx.fillRect(
            p.x,
            0,
            p.width,
            p.top
        );

        ctx.fillRect(
            p.x,
            p.bottom,
            p.width,
            350-p.bottom
        );

        if(
            82 > p.x &&
            58 < p.x + p.width &&
            (
                birdY-12 < p.top ||
                birdY+12 > p.bottom
            )
        ){
            resetGame();
        }

        if(p.x + p.width < 0){
            pipes.splice(i,1);
            score++;
        }
    }

    if(birdY > 350 || birdY < 0){
        resetGame();
    }

    ctx.fillStyle="#ff4f81";
    ctx.font="20px Arial";
    ctx.fillText("❤️ "+score,15,30);

    requestAnimationFrame(update);
}

document.addEventListener("keydown",function(e){

    if(e.code === "Space"){
        velocity = jump;
    }
});

canvas.addEventListener("click",function(){
    velocity = jump;
});

update();

</script>
